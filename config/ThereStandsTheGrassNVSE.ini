[General]
bEnabled=1

[Interaction]
fRadius=100.0
;sphere radius in game units around the player that bends grass
fStrengthStanding=120.0
;base push while standing, rendered blade-height response is scaled to 50 percent
fStrengthMax=150.0
;base push at full running speed, rendered blade-height response is scaled to 50 percent
fSpeedForMax=300.0
;player speed that reaches fStrengthMax
fSpringBackSeconds=0.5
;how quickly grass recovers when the player slows or leaves
fPositionLagSeconds=0.08
;how tightly the bend centre follows the player

[Compat]
bDisableWithNVR=1
;fail cleanly when New Vegas Reloaded owns the grass shaders

[Debug]
bDebugLog=0
;write ThereStandsTheGrassNVSE.log, off unless diagnosing

[Trees]
bTrees=1
;bend speedtree shrubs and trees as well as grass, WastelandShrub01 is the common one
fTreeRadius=160.0
;reach in units, wider than grass because the shrubs are bigger
fTreeStrengthScale=0.8
;fraction of the grass push applied to trees, they are woody so they should barely give
fTreeHeight=175.0
;plant height in units, WastelandShrub01 measures 175 in its OBND

[Foliage]
bFoliage=1
;lean static desert plants away from the player. statics have no wind shader so the whole plant
;is rotated at its base. nothing is written to the save, it dies with the cell
fFoliageRadius=200.0
;how close you have to be, in units
fFoliageMaxDegrees=18.0
;maximum lean at point blank
fFoliageSpeed=6.0
;how fast the plant leans and recovers
iFoliageRescanMS=400
;how often nearby plants are re-collected
fFoliageInnerRadius=45.0
;the lean direction turns freely outside this and resists progressively inside it
fFoliageTurnSpeed=3.0
;how quickly the lean direction follows you
sFoliageForms=000EC8D3,000EC8D2,000E8A9B,000E8AA1,000E8B32,000EAC99,000EAC9A,000EAC9B
;creosote bush small and large, yucca A/B/C, banana yucca and its picked and withered variants
